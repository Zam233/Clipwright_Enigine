server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;   # SSE 长连接
    }

    location /renders/ {
        proxy_pass http://backend:8080;
    }

    location /voice_audio/ {
        proxy_pass http://backend:8080;
    }

    location / {
        try_files $uri /index.html;
    }
}
