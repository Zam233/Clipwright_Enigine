fields:
  provider:
    type: string
    value: "volcengine"
    label: "生成 Provider（volcengine/kling/runway）"
    description: "volcengine = 火山方舟 Seedance；kling / runway 需对应凭据"
  api_key:
    type: string
    value: ""
    secret: true
    label: "API Key"
    description: "当前 provider 的密钥（volcengine = ARK_API_KEY；留空则读对应环境变量）"
  ark_base_url:
    type: string
    value: ""
    label: "Ark Base URL"
    description: "火山方舟 API 地址；留空则读环境变量 ARK_BASE_URL"
  model:
    type: string
    value: ""
    label: "模型名"
    description: "生成模型（如 doubao-seedance-1-5-pro）；留空则读环境变量 ARK_SEEDANCE_MODEL"
  poll_interval_sec:
    type: int
    value: 5
    label: "轮询间隔(秒)"
    description: "异步生成任务的状态轮询间隔"
  poll_timeout_sec:
    type: int
    value: 900
    label: "轮询超时(秒)"
    description: "异步生成任务的最长等待时间"
