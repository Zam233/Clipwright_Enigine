id: "image_generate"
name: "AI 生图（image_generate）"
version: "1.1.0"
kind: "capability"
description: "文生图工具与 provider：image_generate / image_generate_batch，产物落工作区 materials/image/；厂商知识只在本插件"
author: "Clipwright Team"
entry_point: "image_generate.main"

# 声明即授权（新契约）：image_provider + tool 贡献
api_version: "2"
contributions:
  - kind: image_provider
    id: openai_compatible
    # 不声明 config_schema：base_url / api_key / timeout_sec 是「源」的字段，
    # 由 ProvidersPage 的源设置统一渲染；插件再声明一遍会出现两组输入框，
    # 且插件 config 与源配置互不同步（死旋钮）。厂商专有参数等真正需要时再补。
    capabilities:
      sizes: "any"
      max_n: 4
      reference_image: false
      output_formats: ["png", "jpeg", "webp"]
      max_prompt_chars: 4000
      concurrency: 2
      size_dialect: "wxh"
  - kind: tool
    id: image_generate
  - kind: tool
    id: image_generate_batch
