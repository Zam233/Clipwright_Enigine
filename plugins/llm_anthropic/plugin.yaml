id: llm_anthropic
name: Anthropic LLM Provider
version: 1.0.0
kind: capability
api_version: "2"
description: 提供 anthropic LLM provider；插件存在时内置同名实现自动让位
entry_point: "llm_anthropic.main"
permissions: []
# 声明接管内置同名 provider：插件晚于内置注册（运行时启用插件）时靠它把归属切过来；
# 插件先注册时则由 providers/builtin_registry.py 的逐 id 让位自动跳过内置。
override_builtin: true
contributions:
  - kind: llm_provider
    id: anthropic
    config_schema:
      base_url:
        type: string
        label: API Base URL
        placeholder: https://api.anthropic.com
      api_key:
        type: string
        label: API Key
        secret: true
    capabilities:
      stream: true
      tools: true
      reasoning: true
      usage: true
      models: true


