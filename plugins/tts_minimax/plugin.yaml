id: tts_minimax
name: MiniMax TTS 协议插件
version: 1.0.0
kind: capability
api_version: "2"
description: 提供 minimax 协议层 TTS provider（MiniMax speech 接口、系统音色语音 ID）；不含配音工作流
entry_point: "tts_minimax.main"
permissions: []
override_builtin: true
contributions:
  - kind: tts_provider
    id: minimax
    config_schema:
      api_key:
        type: string
        label: MiniMax API Key
        secret: true
      default_model:
        type: string
        label: 默认模型
        default: MiniMax/speech-2.8-turbo
    capabilities:
      stream: false
      needs_uploader: true
