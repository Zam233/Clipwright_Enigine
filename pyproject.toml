[project]
name = "clipwright"
version = "0.1.0"
description = "帧艺 ClipWright 内容视频编排引擎 — AI 驱动的视频内容编排后端"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Zam233" },
]
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "sqlite-utils>=3.37",
    "numpy>=2.0.0",
    "isobase @ git+https://github.com/landspark/IsoBase.git",
    "chromadb>=1.5.0",
    "sentence-transformers>=3.0",
    "dashscope>=1.22.0",
    "pymongo>=4.8.0",
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
# 可选功能依赖：RAG OpenAI 嵌入 / 本地语音转写
extras = [
    "openai>=1.40.0",
    "openai-whisper>=20231117",
    "faster-whisper>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["clipwright/api", "clipwright/services", "clipwright/material"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["clipwright*"]
exclude = ["tests*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
