<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帧艺 ClipWright — 测试前端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <h1>ClipWright <small>帧艺 · 测试前端</small></h1>
  <nav>
    <a class="active" onclick="switchSection('health')">健康检查</a>
    <a onclick="switchSection('persona')">Persona</a>
    <a onclick="switchSection('forge')">PersonaForge</a>
    <a onclick="switchSection('chat-forge')">对话创建</a>
    <a onclick="switchSection('pipeline')">Pipeline</a>
    <a onclick="switchSection('tool')">工具</a>
    <a onclick="switchSection('skill')">技能</a>
    <a onclick="switchSection('animation')">动画</a>
    <a onclick="switchSection('material')">素材库</a>
    <a onclick="switchSection('plugin')">插件</a>
    <a onclick="switchSection('edit-workspace')">剪辑工作台</a>
    <a onclick="switchSection('template')">模板</a>
    <a onclick="switchSection('editor')">对话编辑</a>
    <a onclick="switchSection('type-maker')">类型制作器</a>
    <a onclick="switchSection('fontconfig')">字体配置</a>
    <a onclick="switchSection('webhook')">Webhook</a>
    <a onclick="switchSection('model-test')">模型测试</a>
  </nav>
  <div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">检查中...</span>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="toolbar">
    <span>API 地址</span>
    <input id="apiBase" value="http://localhost:8000" placeholder="http://localhost:8000">
    <button class="btn btn-secondary btn-sm" onclick="checkHealth()">连接</button>
  </div>

  <div class="content" id="mainContent">
    <!-- 各面板页面由 sections/*.html 动态加载 -->
  </div><!-- /content -->
</div><!-- /main -->

<script src="js/app.js?v=20260713"></script>
<script src="js/persona.js?v=20260713"></script>
<script src="js/forge.js?v=20260713"></script>
<script src="js/chat-forge.js?v=20260713"></script>
<script src="js/pipeline.js?v=20260713"></script>
<script src="js/model-test.js?v=20260713"></script>
<script src="js/tool.js"></script>
<script src="js/skill.js"></script>
<script src="js/animation.js"></script>
<script src="js/material.js"></script>
<script src="js/plugin.js"></script>
<script src="js/edit-workspace.js"></script>
<script src="js/type-maker.js"></script>
<script src="js/template.js"></script>
<script src="js/editor.js"></script>
<script src="js/font.js"></script>
<script src="js/webhook.js"></script>
<script>
(async () => {
  // 先加载健康检查面板，再检查后端健康状态
  await switchSection('health');
  checkHealth();
  // 面板数据在 switchSection 钩子中按需加载
})();
</script>
</body>
</html>
