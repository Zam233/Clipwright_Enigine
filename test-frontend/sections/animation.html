<div id="section-animation" class="section">
  <div class="card"><div class="card-header">动画定义 — JSON 规范动画引擎</div>
    <div class="tabs">
      <div class="tab active" onclick="switchAnimTab('onscreen',this)">Onscreen (<span id="animOnscreenCount">0</span>)</div>
      <div class="tab" onclick="switchAnimTab('text',this)">Text (<span id="animTextCount">0</span>)</div>
      <div class="tab" onclick="switchAnimTab('transition',this)">Transition (<span id="animTransCount">0</span>)</div>
      <div class="tab" onclick="switchAnimTab('all',this)">All</div>
    </div>
    <div class="card-body" id="animList" style="max-height:500px;overflow-y:auto">
      <button class="btn btn-primary" onclick="listAnimations()">刷新</button>
      <div id="animListResult" class="mt-2"></div>
    </div>
  </div>
  <div class="card"><div class="card-header">动画详情</div><div class="card-body">
    <div class="form-row">
      <div class="form-group"><label>动画 ID</label><input id="animGetId" value="fade_in"></div>
      <div class="form-group" style="align-self:flex-end"><button class="btn btn-primary" onclick="getAnimation()">查看</button></div>
    </div>
    <div id="animDetailResult"></div>
  </div></div>
</div>
