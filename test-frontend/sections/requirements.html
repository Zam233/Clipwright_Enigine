<div class="section active" id="section-requirements">
  <h2>需求工作台</h2>
  <p class="text-secondary">对话制定创作方案 → 生成成片规划书 → 确认后启动管线</p>

  <div id="reqInitForm" class="card">
    <div class="card-header">开始新创作</div>
    <div class="card-body">
      <div class="form-group">
        <label>创作主题 <span class="text-danger">*</span></label>
        <input id="reqTopic" class="form-input" placeholder="视频主题/标题">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>视频类型</label>
          <select id="reqCategory" class="form-input">
            <option value="knowledge_longform">知识长视频</option>
            <option value="kichiku_fastcut">鬼畜快剪</option>
            <option value="digital_review">数码评测</option>
            <option value="vlog_daily">日常Vlog</option>
          </select>
        </div>
        <div class="form-group">
          <label>风格 (Persona ID)</label>
          <input id="reqPersona" class="form-input" placeholder="留空默认">
        </div>
        <div class="form-group">
          <label>配音时长 (秒)</label>
          <input id="reqDuration" class="form-input" type="number" value="300" min="30" max="3600">
        </div>
      </div>
      <div class="form-group">
        <label>文稿内容（可选）</label>
        <textarea id="reqScript" class="form-input" rows="3" placeholder="已有文稿粘贴在此，留空则由结构 Agent 生成"></textarea>
      </div>
      <div class="form-group">
        <label class="flex-between">
          <span>配音文件</span>
          <span class="text-secondary text-xs">上传后自动填入时长</span>
        </label>
        <div class="flex gap-md">
          <input id="reqAudioPath" class="form-input" placeholder="配音文件路径" style="flex:1">
          <button class="btn btn-sm btn-secondary nowrap" onclick="document.getElementById('reqAudioFile').click()">浏览</button>
          <input type="file" id="reqAudioFile" style="display:none" accept=".wav,.mp3,.m4a,.mp4" onchange="reqUploadAudio(event)">
        </div>
        <input type="hidden" id="reqAudioDuration" value="0">
      </div>
      <div class="form-group">
        <label>字幕切分方式</label>
        <select id="reqSplitMode" class="form-input">
          <option value="period">按句号切分（。！？）</option>
          <option value="punctuation">按标点切分，保留？！</option>
        </select>
      </div>
      <button class="btn btn-primary w-full" onclick="reqStartSession()">开始对话创作</button>
    </div>
  </div>

  <div id="reqChatArea" class="card" style="display:none">
    <div class="card-header">
      <span>创作方案对话</span>
      <div class="flex gap-sm">
        <span id="reqStatusBadge" class="badge">会话中</span>
        <button class="btn btn-sm btn-secondary" onclick="reqRefreshSession()" title="刷新">刷新</button>
        <button class="btn btn-sm btn-danger" onclick="reqConfirmEnd()" title="结束">结束</button>
      </div>
    </div>
    <div class="card-body" style="padding:0;display:flex;flex-direction:column;height:520px">
      <div id="reqMessages" class="chat-messages" style="margin:0;border-radius:0;border:none;flex:1">
        <div id="reqTypingIndicator" class="req-typing" style="display:none">
          <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
          <span class="text-secondary text-sm" style="margin-left:8px">需求助手正在思考...</span>
        </div>
      </div>
      <div style="padding:12px;border-top:1px solid var(--border)">
        <div class="flex" style="align-items:flex-end;gap:8px">
          <div style="flex:1">
            <textarea id="reqInput" class="form-input" rows="2" placeholder="输入你的需求和想法..."
              onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();reqSendMessage()}"></textarea>
            <div class="flex gap-sm" style="margin-top:6px">
              <label class="btn btn-sm btn-secondary" style="cursor:pointer">
                上传参考
                <input type="file" id="reqFileInput" style="display:none" onchange="reqUploadFile()" multiple>
              </label>
              <span id="reqFileName" class="text-secondary text-sm"></span>
            </div>
          </div>
          <button class="btn btn-primary" onclick="reqSendMessage()" style="height:44px">发送</button>
        </div>
      </div>
    </div>
  </div>

  <div id="reqBriefArea" class="card" style="display:none">
    <div class="card-header">创作方案</div>
    <div class="card-body">
      <div id="reqBriefContent" class="brief-card p-md"></div>
      <div class="flex gap-md" style="margin-top:12px">
        <button class="btn btn-primary" onclick="reqConfirmBrief()">确认方案</button>
        <button class="btn btn-secondary" onclick="document.getElementById('reqInput').focus()">继续修改</button>
      </div>
    </div>
  </div>

  <div id="reqPlanArea" class="card" style="display:none">
    <div class="card-header">
      <span>成片规划书</span>
      <div class="flex gap-lg">
        <span id="reqPlanStats" class="text-secondary text-sm"></span>
        <button class="btn btn-sm btn-secondary" onclick="reqExportPlan()">导出 MD</button>
      </div>
    </div>
    <div class="card-body">
      <div id="reqPlanLayout" class="flex" style="align-items:flex-start;gap:16px">
        <div id="reqPlanNav" class="flex-shrink-0 overflow-auto" style="width:200px;max-height:400px;border-right:1px solid var(--border);padding-right:12px"></div>
        <div id="reqPlanContent" class="req-plan flex-1" style="min-height:400px;max-height:600px;overflow-y:auto;padding:20px;background:#111;border-radius:var(--radius);border:1px solid var(--border)"></div>
      </div>
      <div class="flex gap-md" style="margin-top:12px">
        <button id="reqConfirmPlanBtn" class="btn btn-primary" onclick="reqConfirmPlan()">确认并开始制作</button>
        <button class="btn btn-secondary" onclick="reqRequestModify()">提出修改</button>
      </div>
    </div>
  </div>

  <!-- 跳转到剪辑工作台后管线在后台执行，见剪辑工作台的时间轴面板 -->
  <div id="reqToast" class="toast" style="display:none"></div>
</div>
