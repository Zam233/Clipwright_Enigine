<div id="section-fontconfig" class="section">
  <h2>字体配置 <small style="font-weight:normal;font-size:12px;color:var(--text2)">FontConfig</small></h2>
  <div style="display:flex;gap:12px;flex-wrap:wrap">
    <div class="card" style="flex:1;min-width:300px">
      <h3>默认字体</h3>
      <div id="fcDefaultResult" class="result-box" style="margin-top:8px;font-size:12px;word-break:break-all">查询中...</div>
    </div>
    <div class="card" style="flex:1;min-width:300px">
      <h3>按名称查询</h3>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input id="fcFontName" value="msyh.ttc" placeholder="字体文件名" style="flex:1;padding:6px 8px">
        <button class="btn btn-sm" onclick="resolveFont()">查询</button>
      </div>
      <div id="fcResolveResult" class="result-box" style="margin-top:8px;font-size:12px;word-break:break-all"></div>
    </div>
  </div>
  <div class="card" style="margin-top:12px">
    <h3 style="display:flex;justify-content:space-between;align-items:center">
      <span>所有字体 <span id="fcFontCount" style="font-weight:normal;font-size:11px;color:var(--text2)"></span></span>
      <button class="btn btn-sm" onclick="listFonts()">刷新</button>
    </h3>
    <div style="margin-top:8px">
      <input id="fcSearch" placeholder="搜索字体..." style="width:100%;padding:6px 8px;margin-bottom:8px" oninput="filterFonts()">
      <div id="fcFontList" style="max-height:400px;overflow-y:auto;font-size:11px"></div>
    </div>
  </div>
</div>
