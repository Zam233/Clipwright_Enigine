<div id="section-editor" class="section">
  <div style="display:flex;gap:12px;height:calc(100vh - 80px)">
    <div style="width:280px;flex-shrink:0;display:flex;flex-direction:column;gap:8px">
      <div class="card" style="margin:0;flex:1">
        <div class="card-header" style="padding:8px 12px;font-size:12px">
          <span>编辑会话</span>
          <button class="btn btn-primary btn-sm" style="font-size:9px;padding:2px 8px" onclick="edNewSession()">+ 新建</button>
        </div>
        <div id="edSessionInfo" class="card-body" style="padding:10px;font-size:11px">
          <div class="text-muted">点击新建创建编辑会话</div>
        </div>
      </div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:8px">
      <div class="card" style="margin:0;flex:1;display:flex;flex-direction:column">
        <div class="card-header" style="padding:8px 12px;font-size:12px">对话编辑</div>
        <div id="edMessages" style="flex:1;overflow-y:auto;padding:10px;font-size:12px;line-height:1.6">
          <div class="text-muted" style="text-align:center;padding:40px">输入编辑指令开始修改视频<br>
          <span style="font-size:10px">例如: "把字幕改成金色粗体" "调亮画面" "加暗角效果"</span></div>
        </div>
        <div style="border-top:1px solid var(--border);padding:8px 10px;display:flex;gap:6px">
          <input id="edInput" placeholder="输入编辑需求..." style="flex:1;font-size:12px;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius)">
          <button class="btn btn-primary" onclick="edSend()" style="font-size:11px">发送</button>
        </div>
      </div>
    </div>
  </div>
</div>
