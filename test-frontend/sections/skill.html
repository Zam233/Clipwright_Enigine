<div id="section-skill" class="section">
  <div class="card"><div class="card-header">技能 — 可组合的高级能力</div><div class="card-body">
    <button class="btn btn-primary" onclick="listSkills()">刷新技能列表</button>
    <div id="skillList"></div>
  </div></div>
  <div class="card"><div class="card-header">执行技能</div><div class="card-body">
    <div class="form-row">
      <div class="form-group"><label>技能名</label><input id="skillExecName" value="generate_captions"></div>
      <div class="form-group"><label>参数 (JSON)</label><input id="skillExecParams" value='{"text": "hello world caption test"}'></div>
    </div>
    <button class="btn btn-primary" onclick="execSkill()">执行</button>
    <div id="skillExecResult"></div>
  </div></div>
</div>
