name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # fonts-noto-cjk：字幕/快路径的字形解析在 Linux 上依赖系统中的 CJK 字体
      # （缺字体时 PIL 渲染中文直接失败，属于真实功能缺口而非测试问题）。
      - name: Install ffmpeg + CJK fonts (渲染/工具类测试依赖)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest -q
      # 门禁分两层：错误类必须为 0；风格类只报告不阻断（历史债见 docs/development.md）。
      - name: Ruff (错误类，必须为 0)
        run: python -m ruff check clipwright --select E9,F63,F7,F82,F823 --output-format=concise
      - name: Ruff (风格类，仅报告)
        run: python -m ruff check clipwright --statistics --exit-zero

  # 前端已独立（方式 A）：前端源码位于独立仓库 J:\Clipweight-Client
  # （本地映射），其 CI 由该仓库自行维护：
  #   jobs.frontend → working-directory: 仓库根
  #   steps: npm ci → npm run typecheck → npm run test → npm run lint
