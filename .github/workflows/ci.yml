name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest -q
      - name: Ruff (advisory)
        run: python -m ruff check clipwright || true

  # 前端已独立（方式 A）：前端源码位于独立仓库 J:\Clipweight-Client
