# LLM MG Generator 配置（内置 llm_mg 引擎）

llm:
  model: ""
  temperature: 0.4
  # MG 输出是 10k 量级 HTML+JSON。max_tokens: 0 = **不设人为上限**
  # （代码会改用 llm.MAX_OUTPUT_TOKENS，由 provider 按自身上限夹取）。
  # 给死小值会截断产物 → 解析失败 → 退化成 method=fallback。
  max_tokens: 0
  timeout: 900

generation:
  max_retries: 2
  # 多方案生成 + 择优（P2-B）：1 = 单方案（默认，行为不变）；2-4 = 并行生成 N 个候选后
  # 按评分取最优（视觉自评分优先，其次 LLM 自批判分）。N 个候选并行发起，
  # 墙钟 ≈ 最慢一个，但 LLM 调用次数与 token 成本 ×N——只在"这条动画很重要"时开。
  variants: 1
  # 生成期门禁：产物 HTML 送 `hyperframes lint` 静态校验，存在 error 级问题
  # （缺 data-width/height、无 window.__timelines 注册、时间元素缺 data-duration 等）
  # 即放弃该产物并走既有降级链；warning 只记录。CLI 不可用时一律放行。
  lint_gate: true
  # 可选的浏览器门禁 `hyperframes check`（运行时/布局/动效/WCAG 对比度）：
  # off = 不启用（默认，避免每次生成都起一次 headless Chrome）
  # warn = 只记录 findings（写 trace），不阻断
  # strict = error 级问题（如文字对比度不达标）即放弃产物、走既有降级链
  check_gate: "off"
  default_duration_sec: 4.0
  # 分辨率兜底值（仅当调用方未传时间线尺寸时使用）。
  # 实际分辨率由时间线（C2）在运行时决定：MGRenderer 优先使用调用方传入的
  # width/height，再回退 mg_def.width/height，最后才回退到这里的 1920x1080。
  # 因此提示词中不得把 1920x1080 写成强制分辨率。
  default_width: 1920
  default_height: 1080

# LLM 自批判质量闭环：校验通过后由 LLM 按设计原则打分，
# 低分（< min_score）且可修复时带批判反馈重试一次。
critique:
  enabled: true
  min_score: 60
  # P1-1 渲染后视觉自评（默认关闭）：JSON 层面的自批判看不到画面。
  # 开启后每次生成多一次 `hyperframes snapshot`（headless Chrome）+ 一次视觉 LLM 调用；
  # 低分（< min_score）会带着视觉问题清单走既有的批判修复路径重做一次。
  # 生效还需全局开关 settings.enable_visual_llm = true（与素材视觉质检共用）。
  visual_eval:
    enabled: false
    min_score: 60
    # null = 自动取三点：入场结束附近 / 中段 / 退场前
    sample_times: null

prompt:
  # PRD：modular=true 时使用 Skill 化计划/规则/镜头模块；false 回退旧单体提示。
  modular: true
  # P2-1：动效配方库注入（animation/mg/knowledge/motion_recipes.yaml）。
  # 按镜头类型/关键词挑选 1-2 条结构骨架（beat 节奏 + 构图 + 禁忌）进入系统提示词，
  # 仅为方法论提炼、已逐条登记来源与许可；库缺失/解析失败自动跳过。
  knowledge_pack: true
  knowledge_max_recipes: 2
templates_search:
  similarity_threshold: 0.6
  max_candidates: 3
